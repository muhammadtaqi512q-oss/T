
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Royal Cyberpunk AI Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --gold: #d4af37;
            --glow: 0 0 15px rgba(212, 175, 55, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: var(--gold);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 { text-shadow: var(--glow); letter-spacing: 2px; }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            padding: 20px;
            background: var(--glass);
            border: 2px solid var(--gold);
            border-radius: 15px;
            box-shadow: var(--glow);
        }

        .cell {
            width: 100px;
            height: 100px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .cell:hover { background: rgba(212, 175, 55, 0.1); }

        #status { margin-top: 20px; font-size: 1.5rem; color: var(--gold); }
        
        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>PLAYER VS BOT</h1>
    <div class="board" id="board">
        <div class="cell" onclick="humanMove(0)"></div>
        <div class="cell" onclick="humanMove(1)"></div>
        <div class="cell" onclick="humanMove(2)"></div>
        <div class="cell" onclick="humanMove(3)"></div>
        <div class="cell" onclick="humanMove(4)"></div>
        <div class="cell" onclick="humanMove(5)"></div>
        <div class="cell" onclick="humanMove(6)"></div>
        <div class="cell" onclick="humanMove(7)"></div>
        <div class="cell" onclick="humanMove(8)"></div>
    </div>
    <div id="status">Your Turn (X)</div>
    <button onclick="resetGame()">Restart Match</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        function humanMove(index) {
            if (board[index] === "" && gameActive) {
                updateBoard(index, "X");
                if (gameActive) {
                    document.getElementById("status").innerText = "Bot is thinking...";
                    setTimeout(botMove, 500);
                }
            }
        }

        function botMove() {
            if (!gameActive) return;

            let move = findBestMove("O") || findBestMove("X") || chooseStrategicMove();
            if (move !== null) updateBoard(move, "O");
        }

        function findBestMove(player) {
            const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                const line = [board[a], board[b], board[c]];
                const countPlayer = line.filter(v => v === player).length;
                const countEmpty = line.filter(v => v === "").length;

                if (countPlayer === 2 && countEmpty === 1) {
                    if (board[a] === "") return a;
                    if (board[b] === "") return b;
                    if (board[c] === "") return c;
                }
            }
            return null;
        }

        function chooseStrategicMove() {
            const priorities = [4, 0, 2, 6, 8, 1, 3, 5, 7];
            for (let pos of priorities) {
                if (board[pos] === "") return pos;
            }
            return null;
        }

        function updateBoard(index, player) {
            board[index] = player;
            document.getElementsByClassName("cell")[index].innerText = player;
            checkWinner();
        }

        function checkWinner() {
            const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById("status").innerText = `${board[a] === 'X' ? 'You' : 'Bot'} Wins!`;
                    gameActive = false;
                    return;
                }
            }
            if (!board.includes("")) {
                document.getElementById("status").innerText = "Draw!";
                gameActive = false;
            } else if (gameActive) {
                document.getElementById("status").innerText = "Your Turn (X)";
            }
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            document.querySelectorAll(".cell").forEach(c => c.innerText = "");
            document.getElementById("status").innerText = "Your Turn (X)";
        }
    </script>
</body>
</html>
