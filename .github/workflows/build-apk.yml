name: Build Clean APK with Icon 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.vibe9.nexura "VIBE PRO"
          
          # 2. Copy Web Source
          cp index.html app/www/
          
          # 3. Handle Icon if present
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
          fi

          cd app

          # 4. Create robust config.xml directly
          cat << 'EOF' > config.xml
          <?xml meversion='1.0' encoding='utf-8'?>
          <widget id="com.vibe9.nexura" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>VIBE PRO</name>
              <description>VIBE Messaging App</description>
              <author email="dev@cordova.apache.org" href="https://cordova.apache.org">Cordova Team</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <icon src="www/icon.png" />
              <platform name="android">
                  <config-file target="AndroidManifest.xml" parent="/*">
                      <uses-permission name="android.permission.RECORD_AUDIO" />
                      <uses-permission name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission name="android.permission.READ_EXTERNAL_STORAGE" />
                      <uses-permission name="android.permission.WRITE_EXTERNAL_STORAGE" />
                  </config-file>
              </platform>
          </widget>
          EOF

          # 5. Add plugin & platform, then build
          cordova plugin add cordova-custom-config
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
