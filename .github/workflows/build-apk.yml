name: Build Clean APK with Icon 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.vibe9.nexura "VIBE PRO"
          
          # 2. Copy Web Source
          cp index.html app/www/
          
          # 3. Add Custom Icon to Config if icon.png exists
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi
          
          # 4. Inject Android Permissions for Voice Recording & Media Access
          sed -i '/<\/widget>/i \    <platform name="android">\n        <config-file target="AndroidManifest.xml" parent="/*">\n            <uses-permission name="android.permission.RECORD_AUDIO" />\n            <uses-permission name="android.permission.MODIFY_AUDIO_SETTINGS" />\n            <uses-permission name="android.permission.WRITE_EXTERNAL_STORAGE" opacity="0" />\n            <uses-permission name="android.permission.READ_EXTERNAL_STORAGE" />\n        </config-file>\n    </platform>' app/config.xml

          # 5. Add Android Platform & Build
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
