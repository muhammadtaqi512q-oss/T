name: Build Android APK with Live Preview

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova, Plugins & Configure Permissions
        run: |
          npm install -g cordova
          
          # 1. Create Cordova App
          cordova create vibeApp com.taqi.vibe Vibe
          
          # 2. Copy Source Code & Assets
          cp index.html vibeApp/www/
          if [ -f "icon.png" ]; then
            cp icon.png vibeApp/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' vibeApp/config.xml
          fi
          
          cd vibeApp
          
          # 3. Add Android Platform
          cordova platform add android
          
          # 4. Install Plugins for Microphone Access
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-media-capture
          
          # 5. Inject Manifest Permissions
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' platforms/android/app/src/main/AndroidManifest.xml
          
          # 6. Build APK
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk
          path: vibeApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Online Interactive Preview Link
        if: always()
        run: |
          APK_PATH="vibeApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          
          # Upload APK to Appetize.io Public API for live browser preview
          RESPONSE=$(curl -s -F "file=@$APK_PATH" https://appetize.io/api/v2/apps/public)
          PUBLIC_KEY=$(echo "$RESPONSE" | grep -o '"publicKey":"[^"]*' | cut -d'"' -f4)
          
          if [ -n "$PUBLIC_KEY" ]; then
            PREVIEW_URL="https://appetize.io/app/$PUBLIC_KEY"
            echo "### 📱 Live App Interactive Preview" >> $GITHUB_STEP_SUMMARY
            echo "[Click Here to Open App Simulator in Browser]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📱 Live Preview Instructions" >> $GITHUB_STEP_SUMMARY
            echo "Upload your built APK manually to [Appetize.io Upload](https://appetize.io/upload) to test inside your browser." >> $GITHUB_STEP_SUMMARY
          fi
