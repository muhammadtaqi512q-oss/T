<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Embed</title>
    <style>
        /* Pure page ke margins aur scrollbars ko khatam karne ke liye */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Scrollbars ko hide karne ke liye */
        }
        /* Iframe ko full screen karne ke liye */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://mustjab-king-lyra.hf.space"></iframe>

</body>
</html>
