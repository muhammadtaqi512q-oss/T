<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA Gateway - Created by DEVIL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f0c20; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; background: linear-gradient(45deg, #ff007f, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .sub-title { font-size: 0.75rem; color: #888; letter-spacing: 2px; margin-bottom: 25px; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff007f; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { display: inline-block; padding: 12px 30px; border: none; border-radius: 25px; font-weight: 600; cursor: pointer; background: linear-gradient(45deg, #ff007f, #7928ca); color: #fff; text-decoration: none; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); transition: 0.3s; width: 100%; margin-top: 15px; }
        .btn:hover { transform: translateY(-3px); }
        #error-box { display: none; color: #ff007f; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>LUMINA</h1>
        <div class="sub-title">CREATED BY DEVIL</div>
        
        <div id="loader">
            <div class="spinner"></div>
            <p>Fetching live server link from GitHub...</p>
        </div>

        <div id="content" style="display:none;">
            <p style="color: #00ff80; font-weight: 600;">Live Server Connected Successfully!</p>
            <p style="font-size: 0.8rem; color: #888;">Redirecting you to LUMINA in a moment...</p>
            <a id="live-link" href="#" class="btn" target="_self">OPEN LUMINA NOW</a>
        </div>

        <div id="error-box">
            <p>Could not fetch live URL. The server might be offline.</p>
            <button class="btn" onclick="fetchLiveUrl()">Retry Connection</button>
        </div>
    </div>

    <script>
        // Aapka exact GitHub raw README link
        const readmeUrl = "https://raw.githubusercontent.com/LYRAMOON-STUDIO/LUMINA/refs/heads/main/README.md";

        async function fetchLiveUrl() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error-box').style.display = 'none';

            try {
                // Cache bypass karne ke liye timestamp lagaya hai
                const response = await fetch(readmeUrl + '?t=' + new Date().getTime());
                const text = await response.text();

                // Regex ke zariye README se trycloudflare link extract karna
                const match = text.match(/https:\/\/[a-zA-Z0-9.-]+\.trycloudflare\.com/);

                if (match && match[0]) {
                    const liveUrl = match[0];
                    document.getElementById('live-link').href = liveUrl;
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.display = 'block';

                    // 2 seconds baad automatically redirect kar dega
                    setTimeout(() => {
                        window.location.href = liveUrl;
                    }, 2000);
                } else {
                    throw new Error("URL not found in README");
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error-box').style.display = 'block';
            }
        }

        // Page load hote hi fetch start ho jaye ga
        fetchLiveUrl();
    </script>
</body>
</html>
