<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinzind - AI Image Generator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f0f6fc;
            --subtext-color: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 1px solid #30363d;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .credits {
            font-size: 0.9rem;
            color: var(--subtext-color);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .image-box {
            margin-top: 20px;
            width: 100%;
            min-height: 320px;
            border: 2px dashed #30363d;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #0d1117;
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: none;
            border-radius: 10px;
        }

        .placeholder-text {
            color: var(--subtext-color);
            padding: 10px;
        }

        .download-btn {
            display: none;
            margin-top: 15px;
            background-color: #10b981;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #059669;
        }

        .loader {
            display: none;
            border: 4px solid #30363d;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vinzind</h1>
        <p class="credits">Created by <strong>Muhammad Taqi</strong></p>

        <div class="input-group">
            <input type="text" id="promptInput" placeholder="Prompt likhein (e.g. A futuristic cyberpunk city)...">
            <button id="generateBtn" onclick="generateImage()">Image Generate Karein</button>
        </div>

        <div class="image-box">
            <span class="placeholder-text" id="placeholder">Aap ki image yahan nazar aaye gi</span>
            <div class="loader" id="loader"></div>
            <img id="generatedImage" alt="Generated Image">
        </div>

        <a id="downloadBtn" class="download-btn" href="#" download="vinzind-ai-image.png">Download Image</a>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const imgElement = document.getElementById('generatedImage');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!prompt) {
                alert('Meharbani karke image ka prompt likhein!');
                return;
            }

            // UI updates
            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            loader.style.display = "block";
            placeholder.style.display = "none";
            imgElement.style.display = "none";
            downloadBtn.style.display = "none";

            // Pollinations AI Endpoint
            const encodedPrompt = encodeURIComponent(prompt);
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${seed}&nologo=true`;

            try {
                // Fetch image as blob for secure downloading
                const response = await fetch(imageUrl);
                if (!response.ok) {
                    throw new Error("Image fetch nahi ho saki.");
                }
                const blob = await response.blob();
                const objectURL = URL.createObjectURL(blob);

                imgElement.src = objectURL;
                imgElement.onload = () => {
                    loader.style.display = "none";
                    imgElement.style.display = "block";
                    downloadBtn.href = objectURL;
                    downloadBtn.style.display = "block";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "Image Generate Karein";
                };
            } catch (error) {
                alert("Image generation mein masla aya, dobara koshish karein.");
                loader.style.display = "none";
                placeholder.style.display = "block";
                generateBtn.disabled = false;
                generateBtn.innerText = "Image Generate Karein";
            }
        }
    </script>
</body>
</html>
