<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f7f8fa;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(760px,92vw);height:min(760px,90vh);display:flex;flex-direction:column;border:1px solid #262b35;background:#0e1219}.head{padding:22px 24px;border-bottom:1px solid #262b35;display:flex;align-items:center;gap:14px}.mark{width:38px;height:38px;background:#60a5fa;color:#07111f;display:grid;place-items:center;font-weight:900}.head h1{font-size:17px;margin:0}.head span{color:#8993a4;font-size:12px}.chat{padding:24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:13px 15px;line-height:1.55;font-size:14px;white-space:pre-wrap}.user{align-self:flex-end;background:#eef5ff;color:#0a101a}.bot{align-self:flex-start;background:#171c25;color:#dce3ee}.form{display:flex;border-top:1px solid #262b35;padding:16px;gap:10px}.form input{flex:1;background:#151a22;color:white;border:1px solid #2c3441;padding:14px;outline:none}.form button{border:0;background:#60a5fa;color:#06101d;padding:0 22px;font-weight:800;cursor:pointer}.form button:disabled{opacity:.5}</style></head>
<body><main class="app"><header class="head"><div class="mark">AI</div><div><h1>CORD OF KNOWLEDGE</h1><span>CREATED by Saith Rehman Ali </span></div></header><div id="chat" class="chat"><div class="msg bot">Hello. I am CORD OF KNOWLEDGE How can I help you today?</div></div><form class="form" id="form"><input id="input" autocomplete="off" placeholder="Ask anything..."><button id="send">Send</button></form></main>
<script>const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');function add(t,c){const el=document.createElement('div');el.className='msg '+c;el.textContent=t;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}async function ask(q){const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent("You are a helpful, accurate assistant. Keep answers clear and concise,created by DEVIL DEVELOPERS\n"+'\n\nUser: '+q));if(!res.ok)throw new Error('The AI service is unavailable.');return await res.text();}form.onsubmit=async(e)=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';send.disabled=true;const loading=add('Thinking...','bot');try{loading.textContent=await ask(q)}catch(err){loading.textContent=err.message||'Something went wrong.'}send.disabled=false;input.focus()};</script></body></html>
